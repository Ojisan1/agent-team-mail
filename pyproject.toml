[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-team-mail"
version = "0.1.0"
description = "A locked-down MCP server that lets AI agents email an allowlisted team"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "agent-team-mail contributors" }]
keywords = ["mcp", "email", "ai-agents", "smtp", "imap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
]
dependencies = [
  "mcp>=2.3.0,<3",
  "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2,<10",
  "ruff>=0.14.0,<1",
]

[project.scripts]
agent-team-mail = "agent_team_mail.server:main"

[project.urls]
Homepage = "https://github.com/example/agent-team-mail"
Issues = "https://github.com/example/agent-team-mail/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_team_mail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
